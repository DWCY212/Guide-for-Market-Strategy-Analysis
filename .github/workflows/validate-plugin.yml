name: Validate market strategy guidance plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate plugin manifest and skill
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('plugins/market-strategy-guidance')
          manifest = json.loads((root / '.codex-plugin/plugin.json').read_text(encoding='utf-8'))
          portable = json.loads((root / 'plugin.json').read_text(encoding='utf-8'))
          assert manifest['name'] == 'market-strategy-guidance'
          assert portable['name'] == manifest['name']
          assert portable['version'] == manifest['version']
          assert manifest['skills'] == './skills/'
          skill = root / 'skills/market-strategy-guidance/SKILL.md'
          text = skill.read_text(encoding='utf-8')
          assert text.startswith('---\n')
          end = text.find('\n---', 4)
          frontmatter = yaml.safe_load(text[4:end])
          assert frontmatter['name'] == 'market-strategy-guidance'
          assert frontmatter['description']
          assert '[TODO:' not in text
          print('Plugin validation passed')
          PY
